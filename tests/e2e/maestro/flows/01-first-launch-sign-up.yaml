appId: ${APP_ID}
tags: [smoke]
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: onboarding-next
    timeout: 20000
- tapOn:
    id: onboarding-next
- tapOn:
    id: onboarding-skip
- tapOn:
    id: go-sign-up
# Close the keyboard after each field: on a landscape tablet it covers the next one.
- tapOn:
    id: name
- inputText: E2E Student
- hideKeyboard
- scrollUntilVisible:
    element:
      id: email
- tapOn:
    id: email
- inputText: ${E2E_EMAIL}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: password
- tapOn:
    id: password
- inputText: ${E2E_PASSWORD}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: consent
- tapOn:
    id: consent
- scrollUntilVisible:
    element:
      id: sign-up-submit
- tapOn:
    id: sign-up-submit
# The app sends the code automatically and opens the verification screen.
- extendedWaitUntil:
    visible:
      id: code
    timeout: 20000
- runScript:
    file: ../scripts/read-code.js
    env:
      MOCK_URL: ${MOCK_URL}
      E2E_EMAIL: ${E2E_EMAIL}
- tapOn:
    id: code
# The screen submits by itself after the 6th digit and shows the success screen (no
# keyboard left to hide: hideKeyboard would press Back and close the app).
- inputText: ${output.code}
- extendedWaitUntil:
    visible:
      id: verify-continue
    timeout: 20000
- tapOn:
    id: verify-continue
- extendedWaitUntil:
    visible:
      id: continue-card
    optional: true
    timeout: 10000
- assertNotVisible:
    id: verify-banner
- takeScreenshot: ${SCREENSHOT_DIR}/home-${THEME_SUFFIX}
# The session is saved encrypted on the device: a cold restart must stay signed in.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: Home
    timeout: 20000
- assertNotVisible:
    id: go-sign-up
