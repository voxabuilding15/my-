appId: ${APP_ID}
---
- launchApp
- runFlow: ../scripts/dismiss-system-dialog.yaml
- tapOn: Library
- tapOn: studexa-e2e-biology
- tapOn:
    id: read
- extendedWaitUntil:
    visible:
      id: page-text
    timeout: 20000
- back
- setAirplaneMode: enabled
- extendedWaitUntil:
    visible:
      id: offline-banner
    timeout: 15000
- stopApp
- launchApp
- runFlow: ../scripts/dismiss-system-dialog.yaml
# Restored from the device cache, no network needed.
- tapOn: Library
- assertVisible: studexa-e2e-biology
- tapOn: studexa-e2e-biology
- tapOn:
    id: read
- extendedWaitUntil:
    visible:
      id: page-text
    timeout: 20000
- takeScreenshot: offline-${THEME_SUFFIX}
- setAirplaneMode: disabled
- extendedWaitUntil:
    notVisible:
      id: offline-banner
    timeout: 30000
