appId: ${APP_ID}
name: Main screens in light and dark theme (screenshots for visual regression)
---
- launchApp
- tapOn: Profile
- tapOn:
    id: open-settings
- tapOn:
    id: theme-light
- back
- runFlow:
    file: ../scripts/capture-screens.yaml
    env:
      VARIANT: light
- tapOn: Profile
- tapOn:
    id: open-settings
- tapOn:
    id: theme-dark
- back
- runFlow:
    file: ../scripts/capture-screens.yaml
    env:
      VARIANT: dark
