appId: ${APP_ID}
---
- launchApp
- runFlow: ../scripts/dismiss-system-dialog.yaml
- tapOn: Library
- tapOn: studexa-e2e-biology
- tapOn:
    id: ask
- tapOn:
    id: chat-input
- inputText: Explain osmosis
- tapOn:
    id: send-message
# Killed while the answer streams (the OS reclaiming memory, a crash).
- killApp
- launchApp
- runFlow: ../scripts/dismiss-system-dialog.yaml
# Still signed in, data intact, and the app can be used immediately.
- extendedWaitUntil:
    visible: Library
    timeout: 20000
- tapOn: Library
- assertVisible: studexa-e2e-biology
- tapOn: Chat
- assertVisible: .*photosynthesis.*
