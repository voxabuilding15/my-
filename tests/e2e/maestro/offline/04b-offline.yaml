# Offline, part 2 (airplane mode on): the offline banner appears, and after a cold start the
# library and the cached document still open without network.
appId: ${APP_ID}
---
- launchApp
- runFlow: ../scripts/dismiss-system-dialog.yaml
- extendedWaitUntil:
    visible:
      id: offline-banner
    timeout: 15000
- stopApp
- launchApp
- runFlow: ../scripts/dismiss-system-dialog.yaml
# Restored from the device cache, no network needed.
- tapOn: Library
- assertVisible: studexa-e2e-biology
- tapOn: studexa-e2e-biology
- tapOn:
    id: read
- extendedWaitUntil:
    visible:
      id: page-text
    timeout: 20000
- takeScreenshot: offline-${THEME_SUFFIX}
