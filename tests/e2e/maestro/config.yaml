# Maestro suite for Studexa (Android). Run by .github/workflows/e2e-android.yml against the
# local Supabase stack (emulator → host at 10.0.2.2) with the mock AI, on a phone and a tablet.
flows:
  - flows/*.yaml
executionOrder:
  # Every flow runs even if an earlier one fails, so one failure cannot hide the others.
  continueOnFailure: true
  flowsOrder:
    - 01-first-launch-sign-up
    - 02-upload-and-read
    - 03-ask-ai
    - 05-themes-and-screens
    - 06-crash-recovery
    - 07-sign-out
