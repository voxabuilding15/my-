name: E2E (Android)

# Maestro end-to-end tests on an Android emulator, against the real backend running locally
# (Supabase in Docker, Edge Functions, document worker) with a mock AI model — on a phone and
# a tablet. Also measures startup time, memory, battery, slow networks and visual changes.
on:
  pull_request:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - name: Build the E2E app (release JS bundle, local backend)
        working-directory: apps/mobile
        env:
          APP_VARIANT: preview
          # Allows plain HTTP to the emulator's host; never set for store builds.
          E2E_BUILD: '1'
          EXPO_PUBLIC_SUPABASE_URL: http://10.0.2.2:54321
          # The Supabase CLI's fixed local-development anon key (public, not a secret).
          EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0 # gitleaks:allow
          EXPO_PUBLIC_LEGAL_BASE_URL: https://voxabuilding15.github.io/my-/
          # Prints raw auth errors to the device log (E2E builds only).
          EXPO_PUBLIC_E2E_DIAGNOSTICS: '1'
        run: |
          npx expo prebuild --platform android --no-install --clean
          cd android
          # Enough heap and Metaspace for the React Native native builds on a CI runner.
          # (The generated file may not end with a newline: start the additions on a new line.)
          sed -i '/^org.gradle.jvmargs=/d; /^kotlin.daemon.jvmargs=/d' gradle.properties
          printf '\norg.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8\nkotlin.daemon.jvmargs=-Xmx3g\n' >> gradle.properties
          grep -E 'jvmargs' gradle.properties
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64 \
            --init-script "$GITHUB_WORKSPACE/tests/e2e/gradle/skip-release-lint.gradle"
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

  e2e:
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        device:
          - { name: phone, profile: pixel_6 }
          - { name: tablet, profile: pixel_tablet }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: e2e-apk
          path: apk
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start the backend (Supabase, Edge Functions, worker, mocks)
        run: tests/integration/start-backend.sh
      - name: The app's built-in anon key matches this backend
        run: |
          key=$(supabase status -o env | awk -F= '/^ANON_KEY=/ {gsub(/"/, "", $2); print $2}')
          expected=$(grep -o 'EXPO_PUBLIC_SUPABASE_ANON_KEY: [^ ]*' .github/workflows/e2e-android.yml | head -1 | awk '{print $2}')
          if [ "$key" != "$expected" ]; then echo "::error::Local anon key differs from the one built into the E2E app"; exit 1; fi
          echo "anon key matches"
      - name: Install Maestro
        run: curl -fsSL "https://get.maestro.mobile.dev" | bash
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: E2E on ${{ matrix.device.name }}
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK: ${{ github.workspace }}/apk/app-release.apk
          DEVICE: ${{ matrix.device.name }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.device.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: tests/e2e/scripts/run-on-emulator.sh
      - name: Backend logs
        if: failure()
        run: |
          tail -n 200 tests/integration/reports/*.log
          echo "--- API gateway: auth requests (method path status)"
          docker logs supabase_kong_studexa 2>&1 | grep -E '/auth/v1/' | tail -n 40 || true
          echo "--- GoTrue (auth server)"
          docker logs supabase_auth_studexa 2>&1 | grep -iE 'signup|error|"status":[45]' | tail -n 40 || true
          echo "--- E2E accounts in auth.users"
          docker exec supabase_db_studexa psql -U postgres -At -c "select email, created_at, raw_app_meta_data from auth.users where email like 'e2e-%'" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.device.name }}
          path: tests/e2e/reports/${{ matrix.device.name }}
          retention-days: 14
