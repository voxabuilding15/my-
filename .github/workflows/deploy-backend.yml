name: Deploy backend (Supabase)

# Manual only (Actions → Deploy backend → Run workflow). Nothing here runs on push.
#
# mode = check   validates the GitHub secrets and variables, links the project and lists the
#                migrations that would be applied (dry run). Changes nothing.
# mode = deploy  applies the migrations, sets the Auth settings, the Edge Function secrets,
#                deploys every Edge Function, stores the cron secret in Vault and schedules the
#                storage janitor, then runs the backend check below.
# mode = verify  changes nothing: runs scripts/verify-backend.sh against production (every
#                function answers, secrets, migrations, RLS, seeds, storage, scheduled jobs and
#                their results, Auth settings, security advisor, Resend sender, Anthropic key).
#
# Values come from Settings → Secrets and variables → Actions (see docs/DEPLOYMENT.md).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = dry run, deploy = apply to the production project, verify = test the live backend'
        type: choice
        options: [check, deploy, verify]
        default: check

concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # Production project reference (not secret); a GitHub variable overrides it.
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'hwetzmsvyubvzjucyvuc' }}
      # Edge Function secrets
      AUTH_CODE_PEPPER: ${{ secrets.AUTH_CODE_PEPPER }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
      REVENUECAT_WEBHOOK_SECRET: ${{ secrets.REVENUECAT_WEBHOOK_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      BACKEND_SENTRY_DSN: ${{ vars.BACKEND_SENTRY_DSN }}
      DOCUMENT_PROCESSOR_URL: ${{ vars.DOCUMENT_PROCESSOR_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check the secrets and variables
        shell: bash
        run: |
          missing=()
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF \
            AUTH_CODE_PEPPER CRON_SECRET WORKER_SECRET REVENUECAT_WEBHOOK_SECRET \
            RESEND_API_KEY EMAIL_FROM ANTHROPIC_API_KEY; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            printf '::error::Missing in GitHub (Settings → Secrets and variables → Actions): %s\n' "${missing[@]}"
            exit 1
          fi
          # Generated secrets: at least 32 characters, letters and digits only (they are also
          # used inside SQL and HTTP headers).
          for name in AUTH_CODE_PEPPER CRON_SECRET WORKER_SECRET REVENUECAT_WEBHOOK_SECRET; do
            [[ "${!name}" =~ ^[A-Za-z0-9]{32,}$ ]] ||
              { echo "::error::$name must be at least 32 letters or digits (e.g. openssl rand -hex 32)"; exit 1; }
          done
          [[ "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]] ||
            { echo "::error::SUPABASE_PROJECT_REF must be the 20-character project reference"; exit 1; }
          echo "all values present"

      - name: Link the project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Migrations (dry run)
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Apply the migrations
        if: inputs.mode == 'deploy'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Auth settings
        if: inputs.mode == 'deploy'
        shell: bash
        run: |
          set -o pipefail
          # The app signs users in right after sign-up and verifies the email with its own
          # 6-digit code (auth-email-code function), so Supabase's confirmation link is off.
          # Google sign-in is enabled later, with the Google Cloud client ids.
          body='{
            "site_url": "studexa://",
            "uri_allow_list": "studexa://**,exp+studexa://**",
            "disable_signup": false,
            "external_email_enabled": true,
            "mailer_autoconfirm": true,
            "jwt_exp": 3600,
            "refresh_token_rotation_enabled": true,
            "security_refresh_token_reuse_interval": 10,
            "mfa_totp_enroll_enabled": true,
            "mfa_totp_verify_enabled": true
          }'
          curl -sS --fail-with-body -X PATCH \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
            -d "$body" > /dev/null
          curl -sS --fail-with-body "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" |
            jq '{site_url, uri_allow_list, mailer_autoconfirm, mfa_totp_enroll_enabled, refresh_token_rotation_enabled}'

      - name: Edge Function secrets
        if: inputs.mode == 'deploy'
        shell: bash
        run: |
          umask 077
          file="$RUNNER_TEMP/function-secrets.env"
          {
            echo "ENVIRONMENT=production"
            for name in AUTH_CODE_PEPPER CRON_SECRET WORKER_SECRET REVENUECAT_WEBHOOK_SECRET \
              RESEND_API_KEY EMAIL_FROM ANTHROPIC_API_KEY VOYAGE_API_KEY DOCUMENT_PROCESSOR_URL; do
              [ -n "${!name}" ] && printf '%s=%s\n' "$name" "${!name}"
            done
            [ -n "$BACKEND_SENTRY_DSN" ] && printf 'SENTRY_DSN=%s\n' "$BACKEND_SENTRY_DSN"
          } > "$file"
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" --env-file "$file"
          rm -f "$file"
          supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" | awk '{print $1}'

      - name: Deploy the Edge Functions
        if: inputs.mode == 'deploy'
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"

      - name: Cron secret in Vault and the storage-janitor schedule
        if: inputs.mode == 'deploy'
        shell: bash
        run: |
          set -o pipefail
          # Every 10 minutes, pg_cron calls the storage-janitor function with the cron secret,
          # read from Vault (never stored in a table or in the job text).
          read -r -d '' sql <<SQL || true
          -- pg_net belongs in the extensions schema (security advisor); an early deploy put it
          -- in public. It is not relocatable, so it is re-created: its functions stay in the
          -- net schema and the cron job only refers to them by name.
          do \$x\$
          begin
            if exists (select 1 from pg_extension e join pg_namespace n on n.oid = e.extnamespace
                       where e.extname = 'pg_net' and n.nspname = 'public') then
              drop extension pg_net;
            end if;
          end
          \$x\$;
          create extension if not exists pg_net with schema extensions;
          create extension if not exists pg_cron;
          do \$v\$
          begin
            if exists (select 1 from vault.secrets where name = 'studexa_cron_secret') then
              perform vault.update_secret(
                (select id from vault.secrets where name = 'studexa_cron_secret'), '$CRON_SECRET');
            else
              perform vault.create_secret('$CRON_SECRET', 'studexa_cron_secret', 'storage-janitor bearer token');
            end if;
          end
          \$v\$;
          select cron.schedule('studexa-storage-janitor', '*/10 * * * *', \$job\$
            select net.http_post(
              url := 'https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/storage-janitor',
              headers := jsonb_build_object(
                'Content-Type', 'application/json',
                'Authorization', 'Bearer ' || (select decrypted_secret from vault.decrypted_secrets where name = 'studexa_cron_secret')
              ),
              body := '{}'::jsonb,
              -- pg_net gives up after 5 s by default; a cold start can take longer.
              timeout_milliseconds := 30000
            )
          \$job\$);
          SQL
          jq -n --arg q "$sql" '{query: $q}' |
            curl -sS --fail-with-body -X POST \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
              --data-binary @- > /dev/null
          echo "cron secret stored in Vault; storage janitor scheduled"

      - name: Check the deployment
        if: inputs.mode == 'deploy'
        shell: bash
        run: |
          set -o pipefail
          query() {
            jq -n --arg q "$1" '{query: $q}' |
              curl -sS --fail-with-body -X POST \
                "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
                --data-binary @-
          }
          {
            echo "### Production backend"
            echo "- Project URL: https://$SUPABASE_PROJECT_REF.supabase.co"
            echo "- Migrations applied: $(query "select count(*) as n from supabase_migrations.schema_migrations" | jq -r '.[0].n')"
            echo "- Scheduled jobs: $(query "select string_agg(jobname, ', ' order by jobname) as j from cron.job" | jq -r '.[0].j')"
            echo "- Storage buckets: $(query "select string_agg(id, ', ' order by id) as b from storage.buckets" | jq -r '.[0].b')"
            echo "- Edge Functions:"
            supabase functions list --project-ref "$SUPABASE_PROJECT_REF" | sed 's/^/    /'
            echo
            echo "Next: copy the Project URL and the anon key (Project Settings → API Keys) into the"
            echo "GitHub variables EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_ANON_KEY."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # The API gateway accepts the anon key (the same key the app will use).
          anon=$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" -o json |
            jq -r '.[] | select(.name == "anon") | .api_key')
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://$SUPABASE_PROJECT_REF.supabase.co/auth/v1/settings" -H "apikey: $anon")
          echo "Auth API with the anon key: HTTP $status"
          [ "$status" = "200" ]

      - name: Verify the live backend
        if: inputs.mode == 'deploy' || inputs.mode == 'verify'
        shell: bash
        run: bash scripts/verify-backend.sh 2>&1 | tee "$RUNNER_TEMP/backend-check.txt"; status=${PIPESTATUS[0]}; { echo '### Backend check'; echo '```'; cat "$RUNNER_TEMP/backend-check.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; exit $status
